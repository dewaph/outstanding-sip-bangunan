<script>
const SS='1wKVEoALHczXJqjMF3SiUFSQ7AfkzHCdmhhZG6Zm1-BI',SH=1551022099,SRV='Google Sheets',TAB="'OUTSTANDING '";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BOOK={'AFIE':'089652005352','DEBIE':'085808958307','KHOIRUL HUDA':'085781060618','AFIF':'088806506649','JOKO ARI':'082137055363','MINAN':'081391177271','ROKIMIN':'081215309271','SUTRISNO':'082167638492','REZA':'085725669247','RIZAL':'085659036459','AGUNG':'085741594532','BINTORO':'081818211628'};
let store={};try{store=JSON.parse(localStorage.getItem('hp')||'{}')}catch(e){}
function phone(n){if(store[n]!=null)return store[n];const u=String(n).toUpperCase();const k=Object.keys(BOOK).find(k=>u===k||u.startsWith(k+' '));return k?BOOK[k]:''}
function toWa(v){let d=String(v).replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d.length>=9?d:''}
const isoRe=/^\d{4}-\d\d-\d\d$/,p2=n=>String(n).padStart(2,'0');
const fmtD=v=>isoRe.test(v||'')?v.slice(8)+'/'+v.slice(5,7)+'/'+v.slice(0,4):(v||'');
const todayIso=()=>{const t=new Date();return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate())};
const ddmm=v=>{const s=isoRe.test(v||'')?v:todayIso();return s.slice(8)+'/'+s.slice(5,7)};
const MON={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,agt:8,ags:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
function pd(s){
  s=String(s==null?'':s).trim();if(!s)return null;
  let m=s.match(/^(\d{1,2})[ \-\/]([A-Za-z]{3,})\.?[ \-\/](\d{2,4})$/);
  if(m&&MON[m[2].slice(0,3).toLowerCase()]){const y=+m[3]<100?2000+ +m[3]:+m[3];return y+'-'+p2(MON[m[2].slice(0,3).toLowerCase()])+'-'+p2(m[1])}
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){const y=+m[3]<100?2000+ +m[3]:+m[3];return y+'-'+p2(m[2])+'-'+p2(m[1])}
  return s;
}
function pn(s){
  s=String(s==null?'':s).trim().replace(/\s/g,'');if(s==='')return null;
  if(s.includes('.')&&s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=Number(s);return isNaN(n)?null:n;
}
const rnd=n=>Math.round(n*1e6)/1e6;
const pr=t=>String(t||'').split('|').map(x=>x.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})\s*:\s*([^@]+?)\s*(?:@\s*(.+))?$/)).filter(Boolean).map(m=>({tgl:m[3]+'-'+m[2]+'-'+m[1],jml:pn(m[4]),by:(m[5]||'').trim()})).filter(s=>s.jml!==null);
function clean(s){const p=String(s).split(' - ').map(x=>x.trim()).filter(Boolean);return p.length>1&&p.slice(1).every(x=>p[0].includes(x))?p[0]:p.join(' - ')}

let rows=[],R=new Map(),view=[],page=0,sel=new Map(),editing=null,mcp=null,busy=false;const PS=100;
function mk(v,row){
  const g=i=>String(v[i]==null?'':v[i]);
  const qty=pn(g(3)),has=g(9).trim()!=='',jml=has?(pn(g(9))||0):null;
  const stg=pr(g(12)),sum=stg.reduce((s,x)=>s+x.jml,0),cur=jml||0;
  const sisa=qty===null?null:rnd(qty-cur);
  const r={id:row,row,tgl:pd(g(0)),sip:g(1),spec:g(2).trim(),qtyS:g(3),qty,sat:g(4),spk:g(5),ket:g(6).trim(),pem:g(7).trim(),dtg:pd(g(8)),jml,cur,rawJ:g(9),rawM:g(12),
    stg:stg.length?stg:null,base:stg.length?Math.max(0,rnd(cur-sum)):cur,sisa};
  r.st=!has?'belum':(sisa!==null&&sisa>0?'sebagian':'selesai');
  r.hay=[r.spec,r.spk,r.sip,r.pem,r.ket].join(' ').toLowerCase();
  return r;
}
const vals=res=>{let p=res&&res.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p=null}}return(p&&p.values)||[]};
function errMsg(e){
  switch(e&&e.code){
    case 'no_api':return 'Alamat penghubung Google Sheet belum diisi di halaman ini.';
    case 'server_not_connected':return 'Konektor Google Sheets belum terhubung di akun Anda. Hubungkan di claude.ai (Pengaturan, Konektor), lalu buka ulang halaman ini.';
    case 'needs_reauth':return 'Sambungan Google Sheets perlu diautentikasi ulang di claude.ai (Pengaturan, Konektor).';
    case 'not_in_manifest':case 'approval_required':case 'consent_required':case 'not_granted':return 'Izin akses Google Sheets belum diberikan untuk halaman ini. Buka ulang halaman ini dan setujui permintaan izin.';
    case 'server_unavailable':case 'upstream_error':return 'Google Sheet sedang tidak bisa dihubungi. Periksa internet Anda lalu coba lagi.';
    case 'tool_error':return 'Sheet menolak permintaan: '+(e.message||'');
    case 'conflict':return 'Baris ini sudah diubah orang lain. Data dimuat ulang, silakan ulangi.';
    default:return 'Gagal berhubungan dengan Sheet ('+((e&&e.code)||'tidak diketahui')+').'
  }
}
async function fetchAll(){
  const st=[2,1502,3002,4502];
  const res=await Promise.all(st.map((s,i)=>mcp.callTool(SRV,'get_values',{spreadsheetId:SS,range:i<3?`${TAB}!A${s}:M${st[i+1]-1}`:`${TAB}!A${s}:M`},{cache:false})));
  const out=[];
  res.forEach((r,i)=>vals(r).forEach((v,k)=>{if(v&&String(v[2]||'').trim()&&v[0]!=='Column1')out.push(mk(v,st[i]+k))}));
  return out;
}
async function refresh(){
  if(busy)return;busy=true;
  try{
    rows=await fetchAll();R=new Map(rows.map(r=>[r.row,r]));await loadWa();
    [...sel.keys()].forEach(k=>{const r=R.get(k);if(!r||r.jml===null){sel.delete(k)}});
    const names=[...new Set(rows.map(r=>r.pem).filter(Boolean))].sort(),cur=$('#pem').value;
    $('#pem').innerHTML='<option value="">Semua pemesan</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');
    $('#pem').value=names.includes(cur)?cur:'';
    $('#msg').textContent='';
    $('#info').textContent='Sumber data: Google Sheet OUTSTANDING BANGUNAN - '+rows.length.toLocaleString('id-ID')+' baris';
    const t=new Date();$('#upd').textContent='Diperbarui '+p2(t.getHours())+':'+p2(t.getMinutes());
    apply(true);renderPanel();
  }catch(e){$('#msg').textContent=errMsg(e)}
  finally{busy=false}
}
let lastRev=null;
async function getRev(){try{const c=await mcp.callTool(SRV,'get_spreadsheet',{spreadsheetId:SS,fields:['spreadsheetId']},{cache:false});let p=c&&c.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p=null}}return(p&&p.revisionId)||null}catch(e){return null}}
async function tick(){if(document.hidden||busy||editing!==null)return;const rev=await getRev();if(rev&&rev!==lastRev){await refresh();lastRev=rev}}
async function refreshRow(row){
  const c=await mcp.callTool(SRV,'get_values',{spreadsheetId:SS,range:`${TAB}!A${row}:M${row}`},{cache:false});
  const v=vals(c)[0];if(!v)return;
  const o=mk(v,row),i=rows.findIndex(r=>r.row===row);
  if(i>=0)rows[i]=o;R.set(row,o);
}
function apply(keep){
  const q=$('#q').value.toLowerCase().split(/\s+/).filter(Boolean),pem=$('#pem').value,st=$('#st').value;
  view=rows.filter(r=>(!pem||r.pem===pem)&&(st==='all'||r.st===st)&&q.every(t=>r.hay.includes(t)));
  if($('#ord').value==='new')view.reverse();
  if(!keep)page=0;
  renderTable();
  const c=k=>rows.filter(r=>r.st===k).length;
  $('#stats').innerHTML=`<span class="k k1"><b>${c('belum')}</b>Belum datang</span><span class="k k2"><b>${c('sebagian')}</b>Datang sebagian</span><span class="k k3"><b>${c('selesai')}</b>Sudah datang</span><span class="k k4"><b>${view.length}</b>Ditampilkan</span>`;
}
const LBL={belum:'Belum datang',sebagian:'Sebagian',selesai:'Sudah datang'};
function act(r){
  const w=r.jml!==null?(isSent(r)?`<button class="sm wasent" data-wa="${r.id}" title="Dikirim oleh ${esc((waSent.get(r.id)||{}).by||'')}">Pesan WA sudah dikirim</button> `:`<button class="sm wa" data-wa="${r.id}">Kirim WA</button> `):'';
  if(r.jml!==null)return w+`<button class="sm" data-ed="${r.id}">Ubah</button>`;
  return `<button class="sm primary" data-ed="${r.id}">Input</button>`;
}
function stgHtml(r){
  if(!r.stg)return esc(fmtD(r.dtg));
  const multi=r.stg.length>1||r.base>0;
  return r.stg.map(s=>`<div>${esc(fmtD(s.tgl))}${multi?` (${esc(s.jml)})`:''}${s.by?` <span class="by">${esc(s.by)}</span>`:''}</div>`).join('');
}
const vst=r=>r.stg||(r.jml!==null?[{tgl:isoRe.test(r.dtg||'')?r.dtg:'',jml:r.jml}]:[]);
function editor(r){
  const full=r.sisa!==null&&r.sisa<=0,mx=r.qty===null?'':Math.max(0,rnd(r.qty-r.cur));
  const sl=vst(r).map((s,i)=>`<div class="st"><span>Tahap ${i+1}:</span>${s.by?`<span class="by">${esc(s.by)}</span>`:''}<input type="date" class="s-t" value="${esc(s.tgl)}" aria-label="Tanggal tahap ${i+1}"><input type="number" class="s-j" min="0" step="any" value="${esc(s.jml)}" aria-label="Jumlah tahap ${i+1}"><span>${esc(r.sat)}</span><button class="sm primary" data-ss="${r.id}:${i}">Simpan</button><button class="sm" data-dt="${r.id}:${i}">Hapus</button></div>`).join('');
  return `<tr class="ed"><td colspan="12">${sl}${full?'<div class="note">Pesanan sudah lengkap, tidak ada sisa.</div><button data-cx="1">Tutup</button>':''}<div class="edf"${full?' hidden':''}><span class="note">Diinput oleh <b>${esc(me)}</b></span><label>Tanggal datang tahap ${vst(r).length+1}<input type="date" id="e-t" value="${todayIso()}"></label><label>Jumlah datang (${esc(r.sat)})<input type="number" id="e-j" min="0" max="${mx}" step="any" value="${esc(r.sisa>0?r.sisa:'')}" inputmode="decimal"></label><button class="primary" data-sv="${r.id}">Simpan</button><button data-cx="1">Batal</button>${r.stg?`<button data-rv="${r.id}">Hapus semua input</button>`:''}</div><div class="note" id="e-m" style="color:var(--warn)"></div></td></tr>`;
}
function renderTable(){
  const s=page*PS,sl=view.slice(s,s+PS);
  $('#tb').innerHTML=sl.map(r=>`<tr class="row-${r.st}"><td class="ac">${act(r)}</td><td data-label="Tgl">${fmtD(r.tgl)}</td><td data-label="SIP">${esc(r.sip)}</td><td class="spec">${esc(r.spec)}</td><td class="r" data-label="Qty">${esc(r.qtyS)} ${esc(r.sat)}</td><td data-label="No. SPK">${esc(r.spk)}</td><td data-label="Keterangan">${esc(r.ket)}</td><td data-label="Pemesan">${esc(r.pem)}</td><td data-label="Tgl datang">${stgHtml(r)}</td><td class="r" data-label="Jumlah datang">${r.jml===null?'':esc(r.jml)}</td><td class="r" data-label="Sisa">${r.sisa===null?'':r.sisa}</td><td><span class="b ${r.st}">${LBL[r.st]}</span></td></tr>`+(editing===r.id?editor(r):'')).join('')||'<tr><td colspan="12">Tidak ada barang yang cocok dengan filter.</td></tr>';
  const pages=Math.max(1,Math.ceil(view.length/PS));
  $('#pi').textContent=view.length?`${s+1}-${s+sl.length} dari ${view.length}`:'0 baris';
  $('#pv').disabled=page===0;$('#nx').disabled=page>=pages-1;
}
$('#pv').onclick=()=>{page--;renderTable();scrollTo(0,0)};
$('#nx').onclick=()=>{page++;renderTable();scrollTo(0,0)};

['q','pem','st','ord'].forEach(i=>$('#'+i).addEventListener(i==='q'?'input':'change',()=>apply()));

const ser=s=>Math.round((Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8))-Date.UTC(1899,11,30))/864e5);
async function writeRow(r,stages,base){
  const total=rnd(base+stages.reduce((s,x)=>s+x.jml,0));
  const c=await mcp.callTool(SRV,'get_values',{spreadsheetId:SS,range:`${TAB}!C${r.row}:M${r.row}`},{cache:false});
  const v=vals(c)[0]||[];
  if(String(v[0]||'').trim()!==r.spec||String(v[7]||'')!==r.rawJ||String(v[10]||'')!==r.rawM){refresh();throw{code:'conflict'}}
  const cell=col=>({sheetId:SH,startRowIndex:r.row-1,endRowIndex:r.row,startColumnIndex:col,endColumnIndex:col+1});
  const last=stages.length?stages[stages.length-1].tgl:null,reqs=[];
  if(last)reqs.push({updateCells:{range:cell(8),rows:[{values:[{userEnteredValue:{numberValue:ser(last)},userEnteredFormat:{numberFormat:{type:'DATE',pattern:'dd-mmm-yy'}}}]}],fields:'userEnteredValue,userEnteredFormat.numberFormat'}});
  else if(base===0)reqs.push({updateCells:{range:cell(8),rows:[{values:[{}]}],fields:'userEnteredValue'}});
  reqs.push({updateCells:{range:cell(9),rows:[{values:[total>0?{userEnteredValue:{numberValue:total}}:{}]}],fields:'userEnteredValue'}});
  reqs.push({updateCells:{range:cell(12),rows:[{values:[stages.length?{userEnteredValue:{stringValue:stages.map(s=>fmtD(s.tgl)+': '+s.jml+(s.by?' @'+s.by:'')).join(' | ')}}:{}]}],fields:'userEnteredValue'}});
  await mcp.callTool(SRV,'update_spreadsheet',{spreadsheetId:SS,requests:reqs},{cache:false});
  await refreshRow(r.row);lastRev=await getRev();
}
function addSel(id){
  const r=R.get(id);if(!r||r.jml===null)return;
  sel.set(id,true);panelOpen=true;renderPanel();
}
const em=t=>{const m=$('#e-m');if(m)m.textContent=t};
async function save(id){
  const r=R.get(id),tgl=$('#e-t').value,add=num2($('#e-j').value);
  if(!isoRe.test(tgl))return em('Isi tanggal datang.');
  if(add===null||add<=0)return em('Isi jumlah datang lebih dari 0.');
  if(r.qty!==null&&r.cur+add>r.qty+1e-9)return em('Jumlah datang melebihi pesanan di tabel. Maksimal '+rnd(r.qty-r.cur)+' '+r.sat+'.');
  let st0=r.stg||[],base=r.base;if(!r.stg&&r.cur>0&&isoRe.test(r.dtg||'')){st0=[{tgl:r.dtg,jml:r.cur}];base=0}
  const stages=st0.concat({tgl,jml:add,by:me}).sort((a,b)=>a.tgl<b.tgl?-1:a.tgl>b.tgl?1:0);
  $('#e-m').textContent='Menyimpan ke Sheet...';
  try{await writeRow(r,stages,base)}catch(e){return em(errMsg(e))}
  editing=null;apply(true);addSel(id);
}
const num2=v=>(v===''||isNaN(Number(v)))?null:Number(v);
async function editStage(k,btn){
  const [id,i]=k.split(':').map(Number),r=R.get(id);if(!r)return;
  const vs=vst(r),base=r.stg?r.base:0,row=btn.closest('.st');
  const tgl=row.querySelector('.s-t').value,j=num2(row.querySelector('.s-j').value);
  if(!isoRe.test(tgl))return em('Isi tanggal datang.');
  if(j===null||j<=0)return em('Isi jumlah datang lebih dari 0.');
  const ns=vs.map((s,x)=>x===i?{tgl,jml:j,by:s.by||''}:s).sort((a,b)=>a.tgl<b.tgl?-1:a.tgl>b.tgl?1:0);
  const tot=rnd(base+ns.reduce((s,x)=>s+x.jml,0));
  if(r.qty!==null&&tot>r.qty+1e-9)return em('Total datang melebihi pesanan di tabel. Maksimal tahap ini '+rnd(r.qty-(tot-j))+' '+r.sat+'.');
  em('Menyimpan ke Sheet...');
  try{await writeRow(r,ns,base)}catch(e){return em(errMsg(e))}
  editing=null;apply(true);renderPanel();
}
async function delStage(k){
  const [id,i]=k.split(':').map(Number),r=R.get(id);if(!r)return;const vs=vst(r);if(!vs.length)return;
  try{await writeRow(r,vs.filter((_,x)=>x!==i),r.stg?r.base:0)}catch(e){return em(errMsg(e))}
  apply(true);renderPanel();
}
async function remove(id){
  const r=R.get(id);
  try{await writeRow(r,[],r.base)}catch(e){return em(errMsg(e))}
  sel.delete(id);editing=null;apply(true);renderPanel();
}
$('#tb').addEventListener('click',e=>{

});

const USERS=['Dewa','Afga','Daryanto','Wartono'],COL=['#d92d20','#2563eb','#b45309','#15803d'];

const API_URL='https://script.google.com/macros/s/AKfycbz3IW5aW9n-v8a97pYUjj5An1KJBkzqI1Oem28cw4nc7IJxPdHuMSnjfXptzK-hvCvDbQ/exec';
mcp={callTool:async(srv,tool,args)=>{
  if(API_URL.indexOf('GANTI')>=0)throw{code:'no_api'};
  let r;
  try{const h=await fetch(API_URL,{method:'POST',body:JSON.stringify({tool,args})});r=await h.json()}catch(e){throw{code:'upstream_error'}}
  if(!r||!r.ok)throw{code:(r&&r.code)||'upstream_error',message:r&&r.message};
  return {payload:r.result};
}};

const WT='WA_KIRIM',WSID=1859000002;let waSent=new Map(),waTab=false,panelOpen=false;
function updWc(){const c=$('#wc');c.textContent=sel.size;c.hidden=!sel.size;$('#wm').setAttribute('aria-pressed',String(panelOpen));document.body.style.overflow=(panelOpen||!pk.hidden)?'hidden':''}

async function loadWa(){

    const m=new Map();vals(c).forEach(v=>{const row=+v[0];if(row&&v[1]!=null)m.set(row,{spec:String(v[1]).trim(),cur:Number(v[4]),by:String(v[2]||'')})});waSent=m;waTab=true}

async function markSent(b){

  ids.forEach(id=>{const r=R.get(id);if(!r)return;waSent.set(id,{spec:r.spec,cur:r.cur,by:me});rs.push({values:[{userEnteredValue:{numberValue:r.row}},{userEnteredValue:{stringValue:r.spec}},{userEnteredValue:{stringValue:me||''}},{userEnteredValue:{stringValue:ts}},{userEnteredValue:{numberValue:r.cur}}]})});

const PT='PIN_USER',PSID=1859000001;
let pins={},sel1='';
async function sha(n,p){const s='manika2026|'+n+'|'+p;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return 'x'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'y'+(h>>>0).toString(16)}}
async function loadPins(){
  await mcpReady;if(!mcp)throw{code:'no_mcp'};
  const o={};
  try{const c=await mcp.callTool(SRV,'get_values',{spreadsheetId:SS,range:`${PT}!A1:B${USERS.length}`},{cache:false});vals(c).forEach(v=>{if(v&&v[0]&&v[1])o[String(v[0]).trim()]=String(v[1]).trim()})}
  catch(e){if(!e||e.code!=='tool_error')throw e}
  pins=o;
}
async function savePin(n,h){
  try{await mcp.callTool(SRV,'update_spreadsheet',{spreadsheetId:SS,requests:[{addSheet:{properties:{sheetId:PSID,title:PT}}}]},{cache:false})}catch(e){if(!e||e.code!=='tool_error')throw e}
  const i=USERS.indexOf(n);
  await mcp.callTool(SRV,'update_spreadsheet',{spreadsheetId:SS,requests:[{updateCells:{range:{sheetId:PSID,startRowIndex:i,endRowIndex:i+1,startColumnIndex:0,endColumnIndex:2},rows:[{values:[{userEnteredValue:{stringValue:n}},{userEnteredValue:{stringValue:h}}]}],fields:'userEnteredValue'}}]},{cache:false});
}

async function pkGo(){
  const n=sel1,p1=$('#pin1').value.trim(),m=$('#pkmsg'),btn=$('#pkok');
  if(!n)return;
  if(!/^\d{4,6}$/.test(p1)){m.textContent='PIN harus 4 sampai 6 angka.';return}
  btn.disabled=true;m.textContent='';
  try{
    if(pins[n]){
      if(await sha(n,p1)!==pins[n]){m.textContent='PIN salah.';return}
    }else{
      if(p1!==$('#pin2').value.trim()){m.textContent='Pengulangan PIN tidak sama.';return}
      await loadPins();
      if(pins[n]){pkStep(n);m.textContent='PIN sudah pernah dibuat. Masukkan PIN.';return}
      await savePin(n,await sha(n,p1));
    }
    me=n;try{localStorage.setItem('user2',me)}catch(x){}showMe();closePick();
  }catch(x){m.textContent=x&&x.code==='no_mcp'?'Halaman ini harus dibuka lewat claude.ai dengan akun yang punya konektor Google Sheets.':errMsg(x)}
  finally{btn.disabled=false}
}
