<script>

const BOOK={'AFIE':'089652005352','DEBIE':'085808958307','KHOIRUL HUDA':'085781060618','AFIF':'088806506649','JOKO ARI':'082137055363','MINAN':'081391177271','ROKIMIN':'081215309271','SUTRISNO':'082167638492','REZA':'085725669247','RIZAL':'085659036459','AGUNG':'085741594532','BINTORO':'081818211628'};

function toWa(v){let d=String(v).replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d.length>=9?d:''}
const isoRe=/^\d{4}-\d\d-\d\d$/,p2=n=>String(n).padStart(2,'0');

const todayIso=()=>{const t=new Date();return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate())};

const MON={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,agt:8,ags:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
function pd(s){
  s=String(s==null?'':s).trim();if(!s)return null;
  let m=s.match(/^(\d{1,2})[ \-\/]([A-Za-z]{3,})\.?[ \-\/](\d{2,4})$/);
  if(m&&MON[m[2].slice(0,3).toLowerCase()]){const y=+m[3]<100?2000+ +m[3]:+m[3];return y+'-'+p2(MON[m[2].slice(0,3).toLowerCase()])+'-'+p2(m[1])}
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){const y=+m[3]<100?2000+ +m[3]:+m[3];return y+'-'+p2(m[2])+'-'+p2(m[1])}
  return s;
}
function pn(s){
  s=String(s==null?'':s).trim().replace(/\s/g,'');if(s==='')return null;
  if(s.includes('.')&&s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=Number(s);return isNaN(n)?null:n;
}
const rnd=n=>Math.round(n*1e6)/1e6;
const pr=t=>String(t||'').split('|').map(x=>x.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})\s*:\s*([^@]+?)\s*(?:@\s*(.+))?$/)).filter(Boolean).map(m=>({tgl:m[3]+'-'+m[2]+'-'+m[1],jml:pn(m[4]),by:(m[5]||'').trim()})).filter(s=>s.jml!==null);
function clean(s){const p=String(s).split(' - ').map(x=>x.trim()).filter(Boolean);return p.length>1&&p.slice(1).every(x=>p[0].includes(x))?p[0]:p.join(' - ')}

let rows=[],R=new Map(),view=[],page=0,sel=new Map(),editing=null,mcp=null,busy=false;const PS=100;
function mk(v,row){
  const g=i=>String(v[i]==null?'':v[i]);
  const qty=pn(g(3)),has=g(9).trim()!=='',jml=has?(pn(g(9))||0):null;

    stg:stg.length?stg:null,base:stg.length?Math.max(0,rnd(cur-sum)):cur,sisa};

}
const vals=res=>{let p=res&&res.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p=null}}return(p&&p.values)||[]};
function errMsg(e){
  switch(e&&e.code){
    case 'no_api':return 'Alamat penghubung Google Sheet belum diisi di halaman ini.';
    case 'server_not_connected':return 'Konektor Google Sheets belum terhubung di akun Anda. Hubungkan di claude.ai (Pengaturan, Konektor), lalu buka ulang halaman ini.';

    case 'not_in_manifest':case 'approval_required':case 'consent_required':case 'not_granted':return 'Izin akses Google Sheets belum diberikan untuk halaman ini. Buka ulang halaman ini dan setujui permintaan izin.';

    case 'network_error':case 'bad_response':return 'Tidak bisa menghubungi Apps Script. Periksa alamat Apps Script dan pastikan aksesnya diatur ke Siapa saja (Anyone).';

  }
}
async function fetchAll(){
  const st=[2,1502,3002,4502];
  const res=await Promise.all(st.map((s,i)=>mcp.callTool(SRV,'get_values',{spreadsheetId:SS,range:i<3?`${TAB}!A${s}:M${st[i+1]-1}`:`${TAB}!A${s}:M`},{cache:false})));

  return out;
}

  if(busy)return;busy=true;
  try{
    rows=await fetchAll();R=new Map(rows.map(r=>[r.row,r]));await loadWa();await dmSync(!dmLoaded);

let lastRev=null;

async function tick(){if(document.hidden||busy||editing!==null)return;const rev=await getRev();if(rev&&rev!==lastRev){await refresh();lastRev=rev}}

  const c=await mcp.callTool(SRV,'get_values',{spreadsheetId:SS,range:`${TAB}!A${row}:M${row}`},{cache:false});

  const cell=col=>({sheetId:SH,startRowIndex:r.row-1,endRowIndex:r.row,startColumnIndex:col,endColumnIndex:col+1});
  const last=stages.length?stages[stages.length-1].tgl:null,reqs=[];

function dmCache(){try{localStorage.setItem('dmNew',JSON.stringify([...dmNew]));localStorage.setItem('dmOut',JSON.stringify([...dmOut]))}catch(e){}}
function dmPending(){const c=dmCur();for(const[s,x]of c)if(dmSnap.get(s)!==JSON.stringify(x[1]))return true;for(const s of dmSnap.keys())if(!c.has(s))return true;return false}
function dmErr(e){const m=$('#msg');if(!m)return;if(e){m.textContent='Daftar material belum tersimpan di Sheet: '+errMsg(e);dmMsgOn=true}else if(dmMsgOn){m.textContent='';dmMsgOn=false}}
async function dmRead(){
  let c;try{c=await mcp.callTool(SRV,'get_values',{spreadsheetId:SS,range:`${DT}!A1:C`},{cache:false})}catch(e){if(e&&e.code==='tool_error')return null;throw e}
  const m=new Map();vals(c).forEach((v,i)=>{const t=v[0];if((t!=='N'&&t!=='O')||!v[1]||!v[2])return;try{m.set(t+'|'+v[1],{row:i+1,t,k:JSON.parse(v[1]),v:JSON.parse(v[2])})}catch(e){}});return m
}
async function dmEnsure(){
  try{await mcp.callTool(SRV,'update_spreadsheet',{spreadsheetId:SS,requests:[{addSheet:{properties:{sheetId:DSID,title:DT}}}]},{cache:false})}catch(e){if(!e||e.code!=='tool_error')throw e}
  await mcp.callTool(SRV,'update_spreadsheet',{spreadsheetId:SS,requests:[{updateCells:{range:{sheetId:DSID,startRowIndex:0,endRowIndex:1,startColumnIndex:0,endColumnIndex:3},rows:[{values:['JENIS','KUNCI','DATA'].map(x=>({userEnteredValue:{stringValue:x}}))}],fields:'userEnteredValue'}}]},{cache:false});
}
async function dmPush(){
  let rm=await dmRead();if(rm===null){await dmEnsure();rm=new Map()}
  const cur=dmCur(),reqs=[],app=[],str=s=>({userEnteredValue:{stringValue:s}}),rg=r=>({sheetId:DSID,startRowIndex:r-1,endRowIndex:r,startColumnIndex:0,endColumnIndex:3});
  cur.forEach(([k,v,t],sig)=>{const raw=JSON.stringify(v);if(dmSnap.get(sig)===raw)return;const rw={values:[str(t),str(JSON.stringify(k)),str(raw)]},ex=rm.get(sig);
    if(ex)reqs.push({updateCells:{range:rg(ex.row),rows:[rw],fields:'userEnteredValue'}});else app.push(rw)});
  dmSnap.forEach((raw,sig)=>{if(cur.has(sig))return;const ex=rm.get(sig);if(ex)reqs.push({updateCells:{range:rg(ex.row),rows:[{values:[{},{},{}]}],fields:'userEnteredValue'}})});
  if(app.length)reqs.push({appendCells:{sheetId:DSID,rows:app,fields:'userEnteredValue'}});
  if(reqs.length){await mcp.callTool(SRV,'update_spreadsheet',{spreadsheetId:SS,requests:reqs},{cache:false});try{lastRev=await getRev()}catch(e){}}
  dmSnap=new Map();cur.forEach(([k,v],sig)=>dmSnap.set(sig,JSON.stringify(v)));
}
function dmApply(rm){dmNew.clear();dmOut.clear();dmSnap=new Map();rm.forEach((x,s)=>{(x.t==='N'?dmNew:dmOut).set(x.k,x.v);dmSnap.set(s,JSON.stringify(x.v))});dmCache();updDc()}
async function dmSync(first){
  if(!mcp)return;
  if(dmBusy){dmDirty=true;return}
  dmBusy=true;
  try{
    let mig=false;try{mig=localStorage.getItem('dmMig')==='1'}catch(e){}
    if(!(first&&mig)&&(first||dmPending())){await dmPush();try{localStorage.setItem('dmMig','1')}catch(e){}}
    if(!dmDirty){const rm=await dmRead()||new Map();if(!dmDirty)dmApply(rm)}
    dmLoaded=true;dmErr(null);
  }catch(e){dmErr(e)}
  finally{dmBusy=false}
  if(dmDirty){dmDirty=false;dmSync(false)}
  else if(dmOpen&&dmAsk===null&&!(document.activeElement&&document.activeElement.id==='dmq'))renderDm();
}
function dmSave(){dmCache();updDc();dmSync(false)}
function updDc(){const c=$('#dc');if(!c)return;const n=dmEntries('in',true).length;c.textContent=n;c.hidden=!n}
const dmKey=(id,s)=>id+'|'+(s.tgl||'')+'|'+s.jml;
function dmStages(r){const a=vst(r).map(s=>({tgl:s.tgl||'',jml:s.jml,by:s.by||''}));if(r.stg&&r.base>0)a.unshift({tgl:'',jml:r.base,by:''});return a}
function dmK(map,s){if(map.has(s))return s;const n=+s;return map.has(n)?n:null}
function dmUsed(id,tgl,sj){let n=0;dmOut.forEach(v=>{if(v&&typeof v==='object'&&!Array.isArray(v)&&v.id===id&&v.tgl===tgl&&rnd(v.sj==null?v.jml:v.sj)===rnd(sj))n+=v.jml});return rnd(n)}
function dmEntries(tab,all){
  const res=[],seen=new Set();
  (tab==='out'?dmOut:dmNew).forEach((v,k)=>{
    if(typeof k==='number'){
      const spec=tab==='out'?v[0]:v,r=R.get(k);
      if(!r||r.jml===null||r.spec!==spec)return;
      if(tab==='out'){res.push({key:k,r,tgl:r.dtg||'',jml:r.cur,out:v[1],whole:true});return}
      dmStages(r).forEach(s=>{const key=dmKey(r.id,s),rem=rnd(s.jml-dmUsed(r.id,s.tgl,s.jml));if(rem<=1e-9||seen.has(key))return;seen.add(key);res.push({key,r,tgl:s.tgl,jml:rem,sj:s.jml,by:s.by})});
      return;
    }
    const r=R.get(v.id);
    if(!r||r.jml===null||r.spec!==v.spec)return;
    if(tab==='out'){res.push({key:k,r,tgl:v.tgl,jml:v.jml,sj:v.sj==null?v.jml:v.sj,by:v.by,out:v.out});return}
    if(!dmStages(r).some(s=>s.tgl===v.tgl&&s.jml===v.jml)||seen.has(k))return;
    const rem=rnd(v.jml-dmUsed(v.id,v.tgl,v.jml));if(rem<=1e-9)return;
    seen.add(k);res.push({key:k,r,tgl:v.tgl,jml:rem,sj:v.jml,by:v.by});
  });
  const first=new Map();res.forEach((e,i)=>{if(!first.has(e.r.id))first.set(e.r.id,i)});
  res.sort((a,b)=>first.get(a.r.id)-first.get(b.r.id)||(a.tgl<b.tgl?-1:a.tgl>b.tgl?1:0));
  return all?res:res.filter(e=>dmOk(e.r));
}
function dmKeluar(key,tgl,qty){
  const e=dmEntries('in',true).find(x=>x.key===key);if(!e)return;
  const q=rnd(qty==null?e.jml:qty);if(!(q>0)||q>e.jml+1e-9)return;
  const sj=e.sj==null?e.jml:e.sj,ok=dmKey(e.r.id,{tgl:e.tgl,jml:sj})+'#'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  dmOut.set(ok,{id:e.r.id,spec:e.r.spec,tgl:e.tgl,jml:Math.min(q,e.jml),sj,by:e.by||'',out:tgl||todayIso()});
  dmAsk=null;dmSave();renderDm();
}
function dmBalik(s){
  const k=dmK(dmOut,s);if(k===null)return;const v=dmOut.get(k);dmOut.delete(k);
  if(typeof k==='number')dmNew.set(k,v[0]);else{const sj=v.sj==null?v.jml:v.sj,sk=dmKey(v.id,{tgl:v.tgl,jml:sj});if(!dmNew.has(sk))dmNew.set(sk,{id:v.id,spec:v.spec,tgl:v.tgl,jml:sj,by:v.by})}
  dmSave();renderDm();
}
function dmAdd(id,tgl,jml){
  const r=R.get(id);if(!r||r.jml===null)return;
  const key=dmKey(id,{tgl,jml});dmOut.delete(key);dmNew.delete(key);[...dmOut.keys()].forEach(k=>{const v=dmOut.get(k);if(v&&typeof v==='object'&&!Array.isArray(v)&&v.id===id&&v.tgl===tgl&&rnd(v.sj==null?v.jml:v.sj)===rnd(jml))dmOut.delete(k)});
  dmNew.set(key,{id,spec:r.spec,tgl,jml,by:me});dmSave();if(dmOpen)renderDm();
}
function dmDrop(id){
  let ch=false;
  [dmNew,dmOut].forEach(m=>[...m.keys()].forEach(k=>{const v=m.get(k);if(k===id||(v&&typeof v==='object'&&!Array.isArray(v)&&v.id===id)){m.delete(k);ch=true}}));
  if(ch){dmSave();if(dmOpen)renderDm()}
}
const dmCnt=tab=>dmEntries(tab).length;
const DMST={belum:'Belum datang',sebagian:'Datang sebagian',selesai:'Sudah lengkap'};
function dmCard(e,i){
  const r=e.r,o=e.out?e.out:null;
  const sj=e.sj==null?e.jml:e.sj,part=sj-e.jml>1e-9,st=dmStages(r),ix=st.findIndex(s=>s.tgl===e.tgl&&s.jml===sj);
  const tp=!e.whole&&st.length>1&&ix>=0?`<span class="b dmtp">Tahap ${ix+1} dari ${st.length}</span>`:'';
  const sisa=r.st==='sebagian'&&r.sisa>0?`Sisa belum datang: ${esc(rnd(r.sisa))} ${esc(r.sat)}`:'';
  const dari=r.qtyS?`Jumlah pesanan: ${esc(r.qtyS)} ${esc(r.sat)}`:'';
  const kel=o?'':(part?`Datang ${esc(rnd(sj))}, sudah dikeluarkan ${esc(rnd(sj-e.jml))} ${esc(r.sat)}`:'');
  return `<div class="dmc${o?' out':''}"><div class="dmh"><span class="dmnm">${i+1}. ${esc(r.spec)}</span></div>`+
  `<div class="dmk"><div><small>${o?'Jumlah dikeluarkan':part?'Sisa di daftar':'Jumlah datang'}</small><strong>${esc(rnd(e.jml))} ${esc(r.sat)}</strong>${!o&&part?`<small style="margin-top:8px">Sudah dikeluarkan</small><strong>${esc(rnd(sj-e.jml))} ${esc(r.sat)}</strong>`:''}${o?`<small style="margin-top:8px">No. SPK</small><strong>${esc(r.spk)||'-'}</strong>`:''}</div><div><small>Tanggal datang</small><strong>${esc(fmtD(e.tgl))||'-'}</strong>${o?'':`<small style="margin-top:8px">No. SPK</small><strong>${esc(r.spk)||'-'}</strong>`}${o?`<small style="margin-top:8px">Tanggal dikeluarkan</small><strong>${esc(fmtD(o))}</strong>`:''}</div></div>`+
  (o?`<div class="dmx">${tp}<span class="b ${r.st}">${DMST[r.st]}</span>${dari?`<span>${dari}</span>`:''}${sisa?`<span>${sisa}</span>`:''}</div>`:'')+
  `<div class="dmb">${o?`<button class="sm" data-back="${esc(e.key)}">Kembalikan ke daftar</button>`:`<button class="sm primary" data-out="${esc(e.key)}">Keluarkan barang</button>`}</div></div>`;
}
function renderDm(){
  const p=$('#dmp');updDc();$('#dm').setAttribute('aria-pressed',String(dmOpen));
  document.body.style.overflow=(dmOpen||panelOpen||!pk.hidden)?'hidden':'';
  if(!dmOpen){p.hidden=true;return}
  p.hidden=false;
  const names=[...new Set([...dmEntries('in',true),...dmEntries('out',true)].map(e=>e.r.pem).filter(Boolean))].sort();
  const list=dmEntries(dmTab),g={};
  list.forEach(e=>(g[e.r.pem||'Tanpa pemesan']=g[e.r.pem||'Tanpa pemesan']||[]).push(e));
  let h=`<div class="ph"><b>${dmTab==='out'?'Barang dikeluarkan':'Daftar material'}</b><span>${list.length} barang</span><button class="sm" id="dmcl" style="margin-left:auto">Tutup</button></div>`;
  h+=`<div class="dmf"><input id="dmq" type="search" placeholder="Cari barang, no. SPK, atau pengawas" value="${esc(dmQ)}" aria-label="Cari"></div>`;
  h+=`<div class="dmf"><select id="dmsel" aria-label="Pemesan"><option value="">Semua pemesan</option>${names.map(n=>`<option${n===dmPem?' selected':''}>${esc(n)}</option>`).join('')}</select></div>`;
  h+=`<div class="dmtabs"><button class="${dmTab==='in'?'on':''}" data-tab="in">Daftar material (${dmCnt('in')})</button><button class="${dmTab==='out'?'on':''}" data-tab="out">Barang dikeluarkan (${dmCnt('out')})</button></div>`;
  if(!list.length)h+=(dmQ||dmPem)&&dmEntries(dmTab,true).length?'<div class="note">Tidak ada barang yang cocok dengan pencarian.</div>':dmTab==='out'?'<div class="note">Belum ada barang yang dikeluarkan.</div>':'<div class="note">Daftar masih kosong. Barang yang baru Anda input akan muncul di sini.</div>';
  Object.entries(g).forEach(([pem,a])=>{
    h+=`<div class="grp"><div class="gh"><h3>Pemesan: ${esc(pem)}</h3><span class="note">${a.length} barang</span></div>`+
    a.map(dmCard).join('')+'</div>';
  });
  if(dmAsk!==null){const ae=dmEntries('in',true).find(x=>x.key===dmAsk);h+=`<div class="dmmod" id="dmmod" role="dialog" aria-modal="true" aria-labelledby="dmmt"><div class="dmbox"><h3 id="dmmt">Keluarkan barang</h3>${ae?`<div class="dmnm">${esc(ae.r.spec)}</div><div class="note">Jumlah ${esc(rnd(ae.jml))} ${esc(ae.r.sat)}${ae.tgl?', datang tgl '+esc(fmtD(ae.tgl)):''}</div>`:''}<label>Jumlah dikeluarkan (${esc(ae.r.sat)}, maks ${esc(rnd(ae.jml))})<input type="number" id="dmjl" min="0" max="${esc(ae.jml)}" step="any" inputmode="decimal" value="${esc(rnd(ae.jml))}"></label><label>Tanggal dikeluarkan (ketuk untuk memilih dari kalender)<input type="date" id="dmtg" value="${todayIso()}"></label><div class="note" id="dmte" style="color:var(--warn)"></div><div class="dmbb"><button class="sm primary" data-ok="${esc(dmAsk)}">Simpan</button><button class="sm" data-no="1">Batal</button></div></div></div>`}
  p.innerHTML=h;
  if(dmAsk!==null){const i=$('#dmjl')||$('#dmtg');if(i){i.focus();try{i.select()}catch(x){}}}
}
$('#dm').onclick=()=>{dmOpen=!dmOpen;renderDm()};
$('#dmp').addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='dmcl'){dmOpen=false;renderDm()}
  else if(t.dataset.tab){dmTab=t.dataset.tab;dmAsk=null;renderDm()}
  else if(t.dataset.out!==undefined){dmAsk=t.dataset.out;renderDm()}
  else if(t.dataset.no){dmAsk=null;renderDm()}
  else if(t.id==='dmmod'){dmAsk=null;renderDm()}
  else if(t.dataset.ok!==undefined){const ae=dmEntries('in',true).find(x=>x.key===t.dataset.ok),qv=num2(($('#dmjl')||{}).value),mm=$('#dmte');
    if(ae&&(qv===null||qv<=0)){if(mm)mm.textContent='Isi jumlah dikeluarkan lebih dari 0.';const j=$('#dmjl');if(j)j.focus();return}
    if(ae&&qv>ae.jml+1e-9){if(mm)mm.textContent='Jumlah melebihi yang ada. Maksimal '+rnd(ae.jml)+' '+ae.r.sat+'.';const j=$('#dmjl');if(j)j.focus();return}
    const v=($('#dmtg')||{}).value,iso=isoRe.test(v||'')?v:'';if(!iso){const m=$('#dmte');if(m)m.textContent='Pilih tanggal dulu dari kalender.';const i=$('#dmtg');if(i)i.focus();return}dmKeluar(t.dataset.ok,iso,qv)}
  else if(t.dataset.back!==undefined)dmBalik(t.dataset.back)
});
$('#dmp').addEventListener('change',e=>{if(e.target.id==='dmsel'){dmPem=e.target.value;dmAsk=null;renderDm()}});
$('#dmp').addEventListener('input',e=>{if(e.target.id==='dmq'){dmQ=e.target.value;dmAsk=null;renderDm();const q=$('#dmq');if(q){q.focus();const n=q.value.length;try{q.setSelectionRange(n,n)}catch(x){}}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dmOpen&&pk.hidden){if(dmAsk!==null)dmAsk=null;else dmOpen=false;renderDm()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&(e.target.id==='dmtg'||e.target.id==='dmjl')){const b=document.querySelector('#dmmod [data-ok]');if(b)b.click()}});

</script>
<script>(function(){var b=document.getElementById('boot');if(!b)return;var t0=Date.now(),done=false;var ms=['Menghubungi Google Sheet...','Membaca data outstanding...','Menyusun daftar barang...','Hampir selesai...'],mi=0,mt=setInterval(function(){var e=document.getElementById('lds');if(!e){clearInterval(mt);return}mi=Math.min(mi+1,ms.length-1);e.style.opacity=0;setTimeout(function(){e.textContent=ms[mi];e.style.opacity=1},200)},1800);function fin(){if(done)return;done=true;clearInterval(mt);b.classList.add('done');setTimeout(function(){b.remove()},700)}var iv=setInterval(function(){var m=document.getElementById('msg'),age=Date.now()-t0;if(((!document.querySelector('tr.ld')||(m&&m.textContent.trim()))&&age>1500)||age>25000){clearInterval(iv);fin()}},150)})();</script>
